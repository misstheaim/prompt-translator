[package]
name = "prompt-translator"
version = "0.1.0"
description = "Windows tray app for practising English while working with Claude Code"
authors = ["misstheaim"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "prompt_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-log = "=2.10.1"
log = "=0.4.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
thiserror = "=2.0.21"
ts-rs = "=12.0.1"
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
rusqlite_migration = "=2.6.0"
whatlang = "=0.18.0"
uuid ={ version = "=1.29.0", features = ["v4"] }
async-trait = "=0.1.92"
tokio-util = "=0.7.20"
tauri-plugin-clipboard-manager = "=2.5.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"

[target.'cfg(windows)'.dependencies]
# Job Objects for the Claude Code translator runs (kill the whole process tree).
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
