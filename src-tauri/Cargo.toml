[package]
name = "prompt-translator"
version = "0.1.0"
description = "Windows tray app for practising English while working with Claude Code"
authors = ["misstheaim"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "prompt_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "=2.10.1"
log = "=0.4.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "=2.0.21"
ts-rs = "=12.0.1"
uuid = { version = "=1.29.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
